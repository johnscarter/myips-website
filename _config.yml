title: MyIPS
description: >-
  MyIPS is a mobile app for creating, maintaining, and sharing a personal
  health summary based on the International Patient Summary (IPS) standard.
baseurl: ""
url: "https://myips.health"

# Build settings
plugins:
  - jekyll-feed

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - openspec/
  - README.md
